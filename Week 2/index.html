<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My World</title>

    <script>
        // Object example
        const person = {
            name: "Alice",
            age: 30
        };

        person.age = 31;
        person.city = "New York";

        console.log(person);


        // Array example
        let numArr = [3, 6, 7, 9, 10];
        let fruitArr = ["Apple", "Orange", "Grape"];

        console.log(numArr);
        console.log(fruitArr.length);

        console.log(numArr);
        console.log(numArr[3]);

        fruitArr[1] = "Durian";
        console.log(fruitArr[1]);


        // Student object
        let student = {
            firstName: "Susan",
            lastName: "Lee",
            age: 19
        };

        console.log(student.firstName);
        console.log(student["lastName"]);

        student.age = 20;
        console.log(student.age);


        // Comparison
        let number1 = 3;
        let number2 = "3";

        console.log(number1 === number2);
        console.log(number1 == number2);


        // Class
        class TeamMember {
            constructor(firstName, lastName, hobbies, favouriteFood, pets) {
                this.firstName = firstName;
                this.lastName = lastName;
                this.hobbies = hobbies;
                this.favouriteFood = favouriteFood;
                this.pets = pets;
            }
        }


        // Create team members
        const team = [
            new TeamMember(
                "Dave",
                "Darrell",
                ["badminton", "gym", "swimming"],
                ["chicken rice", "egg", "coffee"],
                ["dog", "cat"]
            ),

            new TeamMember(
                "Hashim",
                "Isham",
                ["marathon", "running", "cooking"],
                ["ayam masak merah", "nasi goreng", "KFC"],
                ["cat"]
            ),

            new TeamMember(
                "Ethan",
                "Lim",
                ["marathon", "running", "cooking"],
                ["ayam masak merah", "nasi goreng", "KFC"],
                ["cat"]
            )
        ];


        // Display team
        console.table(team);

    </script>
</head>

<body>
    <h1>My first World</h1>
</body>
</html>
