<!DOCTYPE html>
<html>
<head>
<title> Table Example </title>
</head>
<body>
    <h3>table 1: Table with colspan and rowspan</h3>
    <table border="1" width="300"> 
    <tr>
        <td align="center" colspan="3">Name</td>
    </tr>
    <tr>
        <td align="center" rowspan="3">Age</td>
        <td align="center" colspan="2">Email</td>
        </tr>
        <tr>
            <td height="20"></td>
            <td height="20"></td>
        </tr>
        <tr>
            <td height="20"></td>
            <td height="20"></td>
            
            </td>
        </tr>
    </table>
</body>
<table border="0">
<tr> 
    <td> row 1, cell 1 </td>
    <td> row 2, cell 2 </td>
</tr>  
<tr>
    <td> row 2, cell 1 </td>
    <td> row 2, cell 2 </td>
</tr>  
</table>
</body>
</html>
