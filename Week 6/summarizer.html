<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Summarizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ---------- Colors (light + dark mode) ---------- */
    :root {
      --bg: #f4f1ea;
      --surface: #ffffff;
      --surface-2: #faf8f4;
      --text: #1d1b26;
      --muted: #6b6878;
      --border: #e4dfd4;
      --accent: #4b3fd1;
      --accent-hover: #3b30b5;
      --accent-soft: #ecebfc;
      --danger: #b93a33;
      --danger-soft: #fdecea;
      --ok: #2f8f5b;
      --shadow: 0 1px 2px rgba(29, 27, 38, .04), 0 12px 32px rgba(29, 27, 38, .08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14131a;
        --surface: #1d1c25;
        --surface-2: #23222d;
        --text: #eceaf3;
        --muted: #9b98a8;
        --border: #2f2d3a;
        --accent: #8b82ff;
        --accent-hover: #a29bff;
        --accent-soft: #2a2747;
        --danger: #ff8a80;
        --danger-soft: #3a1f22;
        --ok: #6fd39b;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .35);
      }
    }

    /* ---------- Page layout ---------- */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      line-height: 1.55;
    }

    .page {
      max-width: 820px;
      margin: 0 auto;
      padding: 48px 16px 64px;
    }

    header { margin-bottom: 28px; }
    header h1 { margin: 0 0 6px; font-size: 1.9rem; letter-spacing: -.02em; }
    header p { margin: 0; color: var(--muted); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 20px;
    }

    .step-label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* ---------- 1. Document type picker ---------- */
    .types {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }

    .type input { position: absolute; opacity: 0; pointer-events: none; }

    .type label {
      display: block;
      height: 100%;
      padding: 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--surface-2);
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }

    .type label:hover { border-color: var(--accent); }
    .type .icon { font-size: 1.4rem; display: block; margin-bottom: 4px; }
    .type strong { display: block; font-size: .95rem; }
    .type small { color: var(--muted); font-size: .8rem; }

    .type input:checked + label {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .type input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- 2. File drop zone ---------- */
    .dropzone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 32px 16px;
      border: 2px dashed var(--border);
      border-radius: 14px;
      background: var(--surface-2);
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }

    .dropzone:hover,
    .dropzone.dragging { border-color: var(--accent); background: var(--accent-soft); }
    .dropzone .big { font-size: 2rem; }
    .dropzone .hint { color: var(--muted); font-size: .9rem; }
    .dropzone .file-name { font-weight: 600; color: var(--accent); word-break: break-all; }
    #fileInput { display: none; }

    /* ---------- Summarize button ---------- */
    .actions { display: flex; justify-content: flex-end; margin-top: 20px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, transform .05s;
    }

    .btn:hover:not(:disabled) { background: var(--accent-hover); }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn.loading { cursor: wait; }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, .4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .btn.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Error message ---------- */
    .error {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--danger-soft);
      color: var(--danger);
      font-size: .92rem;
    }

    .error.show { display: block; }

    /* ---------- 3. Summary result ---------- */
    #resultCard { display: none; }
    #resultCard.show { display: block; }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .result-head h2 { margin: 0; font-size: 1.2rem; }

    .badge {
      display: inline-block;
      margin-left: 8px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: .78rem;
      font-weight: 600;
      vertical-align: middle;
    }

    .copy-btn {
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text);
      font: inherit;
      font-size: .85rem;
      cursor: pointer;
    }

    .copy-btn:hover { border-color: var(--accent); }
    .copy-btn.done { color: var(--ok); border-color: var(--ok); }

    .summary { font-size: 1rem; }
    .summary p { margin: 0 0 12px; }
    .summary ul { margin: 0 0 14px; padding-left: 22px; }
    .summary li { margin-bottom: 6px; }
    .summary li::marker { color: var(--accent); }
    .summary strong { color: var(--text); font-weight: 700; }
    .summary h3 { margin: 18px 0 8px; font-size: 1.05rem; }

    footer { text-align: center; color: var(--muted); font-size: .82rem; }
    footer code { background: var(--surface); padding: 2px 6px; border-radius: 6px; }

    @media (max-width: 520px) {
      header h1 { font-size: 1.55rem; }
      .card { padding: 18px; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>📄 PDF Summarizer</h1>
      <p>Choose the kind of document, upload a PDF, and get a summary tailored to it.</p>
    </header>

    <section class="card">
      <!-- Step 1: document type (values match DocumentType in Text_summ_types.py) -->
      <span class="step-label">1 · Document type</span>
      <div class="types">
        <div class="type">
          <input type="radio" name="docType" id="t-general" value="general" checked>
          <label for="t-general"><span class="icon">📝</span><strong>General</strong><small>Short plain summary</small></label>
        </div>
        <div class="type">
          <input type="radio" name="docType" id="t-resume" value="resume">
          <label for="t-resume"><span class="icon">👤</span><strong>Resume</strong><small>Skills, experience, education</small></label>
        </div>
        <div class="type">
          <input type="radio" name="docType" id="t-financial" value="financial_report">
          <label for="t-financial"><span class="icon">📊</span><strong>Financial report</strong><small>Figures, trends, risks</small></label>
        </div>
        <div class="type">
          <input type="radio" name="docType" id="t-academic" value="academic_paper">
          <label for="t-academic"><span class="icon">🎓</span><strong>Academic paper</strong><small>Question, method, findings</small></label>
        </div>
      </div>

      <!-- Step 2: choose a PDF (click or drag and drop) -->
      <span class="step-label">2 · PDF file</span>
      <label class="dropzone" id="dropzone" for="fileInput">
        <span class="big">⬆️</span>
        <span id="dropText"><strong>Click to choose a PDF</strong> or drag it here</span>
        <span class="hint" id="dropHint">Only .pdf files</span>
      </label>
      <input type="file" id="fileInput" accept="application/pdf,.pdf">

      <div class="actions">
        <button class="btn" id="summarizeBtn" disabled>
          <span class="spinner"></span>
          <span id="btnLabel">Summarize</span>
        </button>
      </div>

      <div class="error" id="errorBox" role="alert"></div>
    </section>

    <!-- Step 3: the summary appears here -->
    <section class="card" id="resultCard" aria-live="polite">
      <div class="result-head">
        <h2>Summary <span class="badge" id="typeBadge"></span></h2>
        <button class="copy-btn" id="copyBtn">Copy</button>
      </div>
      <div class="summary" id="summary"></div>
    </section>

    <footer>Calls <code>POST /summarize</code> on your local FastAPI server</footer>
  </main>

  <script>
    const fileInput = document.getElementById("fileInput");
    const dropzone = document.getElementById("dropzone");
    const dropText = document.getElementById("dropText");
    const dropHint = document.getElementById("dropHint");
    const summarizeBtn = document.getElementById("summarizeBtn");
    const btnLabel = document.getElementById("btnLabel");
    const errorBox = document.getElementById("errorBox");
    const resultCard = document.getElementById("resultCard");
    const summaryBox = document.getElementById("summary");
    const typeBadge = document.getElementById("typeBadge");
    const copyBtn = document.getElementById("copyBtn");

    let selectedFile = null;
    let lastSummary = "";

    // ---------- Choosing a file ----------
    function setFile(file) {
      if (!file) return;
      if (!file.name.toLowerCase().endsWith(".pdf")) {
        showError("Please choose a PDF file.");
        return;
      }
      selectedFile = file;
      dropText.innerHTML = '<span class="file-name"></span>';
      dropText.firstChild.textContent = file.name;
      dropHint.textContent = (file.size / 1024).toFixed(0) + " KB · click to change";
      summarizeBtn.disabled = false;
      hideError();
    }

    fileInput.addEventListener("change", () => setFile(fileInput.files[0]));

    ["dragenter", "dragover"].forEach(evt =>
      dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add("dragging"); }));
    ["dragleave", "drop"].forEach(evt =>
      dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove("dragging"); }));
    dropzone.addEventListener("drop", e => setFile(e.dataTransfer.files[0]));

    // ---------- Sending the PDF to the server ----------
    summarizeBtn.addEventListener("click", async () => {
      if (!selectedFile) return;
      const docType = document.querySelector('input[name="docType"]:checked').value;

      const form = new FormData();
      form.append("file", selectedFile);
      form.append("document_type", docType);

      setLoading(true);
      hideError();

      try {
        const res = await fetch("/summarize", { method: "POST", body: form });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const detail = typeof data.detail === "string" ? data.detail : "Something went wrong (" + res.status + ").";
          throw new Error(detail);
        }
        showSummary(data.summary, data.document_type);
      } catch (err) {
        const msg = err instanceof TypeError
          ? "Can't reach the server. Is uvicorn still running?"
          : err.message;
        showError(msg);
      } finally {
        setLoading(false);
      }
    });

    // ---------- Showing the result ----------
    function showSummary(text, docType) {
      lastSummary = text;
      typeBadge.textContent = docType.replace("_", " ");
      summaryBox.innerHTML = renderMarkdown(text);
      resultCard.classList.add("show");
      resultCard.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    // Turns the model's simple Markdown (**bold**, "- " bullets, # headings)
    // into HTML. Text is escaped first so nothing in the PDF can run as code.
    function renderMarkdown(md) {
      const escape = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const inline = s => escape(s)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<em>$2</em>");

      let html = "";
      let depth = 0;           // how many <ul> are open
      const indents = [];      // indent width of each open list

      const closeLists = (toDepth) => {
        while (depth > toDepth) { html += "</li></ul>"; depth--; indents.pop(); }
      };

      for (const line of md.split(/\r?\n/)) {
        const bullet = line.match(/^(\s*)[-*•]\s+(.*)$/);
        const heading = line.match(/^#{1,6}\s+(.*)$/);

        if (bullet) {
          const indent = bullet[1].length;
          if (depth === 0 || indent > indents[indents.length - 1]) {
            html += "<ul>"; depth++; indents.push(indent);
          } else {
            while (depth > 1 && indent < indents[indents.length - 1]) { html += "</li></ul>"; depth--; indents.pop(); }
            html += "</li>";
          }
          html += "<li>" + inline(bullet[2]);
        } else if (heading) {
          closeLists(0);
          html += "<h3>" + inline(heading[1]) + "</h3>";
        } else if (line.trim()) {
          closeLists(0);
          html += "<p>" + inline(line.trim()) + "</p>";
        }
      }
      closeLists(0);
      return html;
    }

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(lastSummary);
        copyBtn.textContent = "Copied ✓";
        copyBtn.classList.add("done");
      } catch {
        copyBtn.textContent = "Copy failed";
      }
      setTimeout(() => { copyBtn.textContent = "Copy"; copyBtn.classList.remove("done"); }, 1800);
    });

    // ---------- Small helpers ----------
    function setLoading(on) {
      summarizeBtn.disabled = on;
      summarizeBtn.classList.toggle("loading", on);
      btnLabel.textContent = on ? "Summarizing…" : "Summarize";
    }

    function showError(msg) { errorBox.textContent = msg; errorBox.classList.add("show"); }
    function hideError() { errorBox.classList.remove("show"); }
  </script>
</body>
</html>
