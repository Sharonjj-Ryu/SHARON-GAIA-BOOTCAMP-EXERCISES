<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Translator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ---------- Colors (light + dark mode) ---------- */
    :root {
      --bg: #f4f1ea;
      --surface: #ffffff;
      --surface-2: #faf8f4;
      --text: #1d1b26;
      --muted: #6b6878;
      --border: #e4dfd4;
      --accent: #4b3fd1;
      --accent-hover: #3b30b5;
      --accent-soft: #ecebfc;
      --gold: #e3a21a;
      --danger: #b93a33;
      --danger-soft: #fdecea;
      --ok: #2f8f5b;
      --shadow: 0 1px 2px rgba(29, 27, 38, .04), 0 12px 32px rgba(29, 27, 38, .08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14131a;
        --surface: #1d1c25;
        --surface-2: #23222d;
        --text: #eceaf3;
        --muted: #9b98a8;
        --border: #2f2d3a;
        --accent: #8b82ff;
        --accent-hover: #a29bff;
        --accent-soft: #2a2747;
        --danger: #ff8a80;
        --danger-soft: #3a2224;
        --ok: #5fd08f;
        --shadow: 0 12px 32px rgba(0, 0, 0, .35);
      }
    }

    /* ---------- Page layout ---------- */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", "Noto Sans Thai", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .app { width: 100%; max-width: 960px; }

    /* ---------- Header ---------- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .brand { display: flex; align-items: center; gap: 14px; }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -.5px;
      box-shadow: 0 6px 16px rgba(75, 63, 209, .3);
    }

    h1 { margin: 0; font-size: 24px; letter-spacing: -.4px; }
    .tagline { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
    }

    .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .status.online .dot { background: var(--ok); box-shadow: 0 0 0 4px rgba(47, 143, 91, .15); }
    .status.offline .dot { background: var(--danger); }

    /* ---------- Main card ---------- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* Language bar */
    .lang-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
    }

    .lang-field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .lang-field input {
      width: 100%;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 17px;
      font-weight: 600;
      padding: 2px 0 4px;
      outline: none;
      transition: border-color .15s;
    }

    .lang-field input:focus { border-bottom-color: var(--accent); }
    .lang-field.to { text-align: right; }
    .lang-field.to input { text-align: right; }

    .swap-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--accent);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform .25s, background .15s;
    }

    .swap-btn:hover { background: var(--accent-soft); transform: rotate(180deg); }

    /* Text panels */
    .panels { display: grid; grid-template-columns: 1fr 1fr; }

    .panel { display: flex; flex-direction: column; min-height: 280px; }
    .panel + .panel { border-left: 1px solid var(--border); }
    .panel.output { background: var(--surface-2); }

    textarea,
    .output-text {
      flex: 1;
      width: 100%;
      padding: 20px;
      border: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 19px;
      line-height: 1.55;
      outline: none;
      resize: none;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    textarea::placeholder { color: var(--muted); opacity: .7; }
    .output-text.empty { color: var(--muted); opacity: .7; }

    /* Pulsing placeholder while waiting for the API */
    .output-text.loading { color: var(--muted); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }

    .panel-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px 12px 20px;
      font-size: 13px;
      color: var(--muted);
    }

    .counter.over { color: var(--danger); font-weight: 600; }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .icon-btn:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
    .icon-btn:disabled { opacity: .4; cursor: default; }

    /* ---------- Bottom bar ---------- */
    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .hint { color: var(--muted); font-size: 13px; }

    kbd {
      font-family: inherit;
      font-size: 12px;
      padding: 2px 6px;
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 6px;
      background: var(--surface);
    }

    .translate-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(75, 63, 209, .28);
      transition: background .15s, transform .1s;
    }

    .translate-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .translate-btn:active:not(:disabled) { transform: translateY(1px); }
    .translate-btn:disabled { opacity: .65; cursor: wait; }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, .4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    .translate-btn.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 14px;
      line-height: 1.5;
    }

    .error.show { display: block; }

    footer { margin-top: 36px; text-align: center; color: var(--muted); font-size: 12px; }

    /* ---------- Mobile ---------- */
    @media (max-width: 720px) {
      body { padding: 24px 16px; }
      .panels { grid-template-columns: 1fr; }
      .panel + .panel { border-left: none; border-top: 1px solid var(--border); }
      .panel { min-height: 200px; }
      .translate-btn { width: 100%; justify-content: center; }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">A文</div>
        <div>
          <h1>Text Translator</h1>
          <p class="tagline">FastAPI + LangChain + Gemini</p>
        </div>
      </div>
      <div class="status" id="apiStatus"><span class="dot"></span><span id="apiStatusText">Checking API…</span></div>
    </header>

    <main class="card">
      <div class="lang-bar">
        <div class="lang-field from">
          <label for="fromLang">From</label>
          <input id="fromLang" list="languages" value="English" autocomplete="off">
        </div>

        <button class="swap-btn" id="swapBtn" title="Swap languages" aria-label="Swap languages">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="m17 20 4-4-4-4"/><path d="M21 16H7"/>
          </svg>
        </button>

        <div class="lang-field to">
          <label for="toLang">To</label>
          <input id="toLang" list="languages" value="Thai" autocomplete="off">
        </div>

        <!-- Suggestions only: users can still type any language -->
        <datalist id="languages">
          <option value="English">
          <option value="Thai">
          <option value="Malay">
          <option value="Chinese (Simplified)">
          <option value="Tamil">
          <option value="Indonesian">
          <option value="Vietnamese">
          <option value="Japanese">
          <option value="Korean">
          <option value="German">
          <option value="French">
          <option value="Spanish">
          <option value="Hindi">
          <option value="Arabic">
          <option value="Italian">
          <option value="Portuguese">
          <option value="Russian">
        </datalist>
      </div>

      <div class="panels">
        <section class="panel">
          <textarea id="sourceText" placeholder="Type or paste text here…" aria-label="Text to translate"></textarea>
          <div class="panel-footer">
            <span class="counter" id="counter">0 / 5000</span>
            <button class="icon-btn" id="clearBtn" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
              Clear
            </button>
          </div>
        </section>

        <section class="panel output">
          <div class="output-text empty" id="outputText" aria-live="polite">Translation will appear here</div>
          <div class="panel-footer">
            <span id="outputMeta"></span>
            <button class="icon-btn" id="copyBtn" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span id="copyLabel">Copy</span>
            </button>
          </div>
        </section>
      </div>
    </main>

    <div class="actions">
      <span class="hint">Press <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to translate</span>
      <button class="translate-btn" id="translateBtn">
        <span class="spinner"></span>
        <span id="translateLabel">Translate</span>
      </button>
    </div>

    <div class="error" id="errorBox" role="alert"></div>

    <footer>Calls <code>POST /translate</code> on your local FastAPI server</footer>
  </div>

  <script>
    // Change this if you run uvicorn on a different host or port
    const API_BASE = "http://127.0.0.1:8000";
    const MAX_CHARS = 5000;

    const fromLang = document.getElementById("fromLang");
    const toLang = document.getElementById("toLang");
    const sourceText = document.getElementById("sourceText");
    const outputText = document.getElementById("outputText");
    const outputMeta = document.getElementById("outputMeta");
    const counter = document.getElementById("counter");
    const clearBtn = document.getElementById("clearBtn");
    const copyBtn = document.getElementById("copyBtn");
    const copyLabel = document.getElementById("copyLabel");
    const swapBtn = document.getElementById("swapBtn");
    const translateBtn = document.getElementById("translateBtn");
    const translateLabel = document.getElementById("translateLabel");
    const errorBox = document.getElementById("errorBox");
    const apiStatus = document.getElementById("apiStatus");
    const apiStatusText = document.getElementById("apiStatusText");

    // ---------- API status (uses the GET / endpoint) ----------
    function setApiStatus(online) {
      apiStatus.className = "status " + (online ? "online" : "offline");
      apiStatusText.textContent = online ? "API online" : "API offline";
    }

    async function checkApi() {
      try {
        const res = await fetch(API_BASE + "/");
        setApiStatus(res.ok);
      } catch {
        setApiStatus(false);
      }
    }

    // ---------- Translate (uses the POST /translate endpoint) ----------
    async function translate() {
      const text = sourceText.value.trim();
      const from = fromLang.value.trim();
      const to = toLang.value.trim();

      if (!text) return showError("Please type some text to translate.");
      if (!from || !to) return showError("Please fill in both languages.");
      if (text.length > MAX_CHARS) return showError(`Text is too long (max ${MAX_CHARS} characters).`);

      hideError();
      setLoading(true);

      try {
        const res = await fetch(API_BASE + "/translate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            input_language: from,
            output_language: to,
            text_input: text,
          }),
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          const detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail);
          throw new Error(detail || `Server returned ${res.status}`);
        }

        showOutput(data.translated_text, from, to);
        setApiStatus(true);
      } catch (err) {
        // fetch() throws a TypeError when the server can't be reached at all
        if (err instanceof TypeError) {
          showError("Can't reach the API. Make sure uvicorn is running on " + API_BASE);
          setApiStatus(false);
        } else {
          showError(err.message);
        }
        resetOutput();
      } finally {
        setLoading(false);
      }
    }

    // ---------- UI helpers ----------
    function setLoading(isLoading) {
      translateBtn.disabled = isLoading;
      translateBtn.classList.toggle("loading", isLoading);
      translateLabel.textContent = isLoading ? "Translating…" : "Translate";
      if (isLoading) {
        outputText.className = "output-text loading";
        outputText.textContent = "Translating…";
        outputMeta.textContent = "";
        copyBtn.disabled = true;
      }
    }

    function showOutput(text, from, to) {
      outputText.className = "output-text";
      outputText.textContent = text.trim();
      outputMeta.textContent = `${from} → ${to}`;
      copyBtn.disabled = false;
    }

    function resetOutput() {
      outputText.className = "output-text empty";
      outputText.textContent = "Translation will appear here";
      outputMeta.textContent = "";
      copyBtn.disabled = true;
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add("show");
    }

    function hideError() {
      errorBox.classList.remove("show");
    }

    function updateCounter() {
      const len = sourceText.value.length;
      counter.textContent = `${len} / ${MAX_CHARS}`;
      counter.classList.toggle("over", len > MAX_CHARS);
      clearBtn.disabled = len === 0;
    }

    // ---------- Event listeners ----------
    translateBtn.addEventListener("click", translate);

    sourceText.addEventListener("input", updateCounter);

    sourceText.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") translate();
    });

    clearBtn.addEventListener("click", () => {
      sourceText.value = "";
      updateCounter();
      resetOutput();
      hideError();
      sourceText.focus();
    });

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(outputText.textContent);
        copyLabel.textContent = "Copied!";
      } catch {
        copyLabel.textContent = "Copy failed";
      }
      setTimeout(() => (copyLabel.textContent = "Copy"), 1500);
    });

    // Swap languages, and move the translation into the input box
    swapBtn.addEventListener("click", () => {
      [fromLang.value, toLang.value] = [toLang.value, fromLang.value];
      if (!copyBtn.disabled) {
        sourceText.value = outputText.textContent;
        updateCounter();
        resetOutput();
      }
    });

    checkApi();
  </script>
</body>
</html>
